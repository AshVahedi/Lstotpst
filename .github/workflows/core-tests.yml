name: Core gameplay tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore test dependencies
        run: dotnet restore Tests/LastOutpost.Core.Tests.csproj
      - name: Build core and run shared NUnit tests
        run: dotnet test Tests/LastOutpost.Core.Tests.csproj --no-restore --configuration Release --logger "trx;LogFileName=core-tests.trx" --results-directory TestResults
      - name: Validate Unity metadata and architecture boundaries
        run: python3 Tools/validate_project.py
      - name: Parse Unity C# syntax without API binding
        run: dotnet run --project Tools/UnitySyntaxCheck/UnitySyntaxCheck.csproj --configuration Release -- .
      - name: Preserve actual test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: TestResults/*.trx
          if-no-files-found: error
